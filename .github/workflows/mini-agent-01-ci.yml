name: Mini Agent 01 CI

on:
  push:
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/mini-agent-01-ci.yml"
  pull_request:
    paths:
      - "mini_agent_01_llm/**"
      - ".github/workflows/mini-agent-01-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the production EC2 after CI succeeds
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mini-agent-01-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_agent_01_llm

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini_agent_01_llm/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test backend API
        working-directory: mini_agent_01_llm/backend
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          LLM_PROVIDER: mock
        run: python -m pytest tests/test_api.py -q

      - name: Validate Compose
        run: docker compose -f deploy/compose.yml config --quiet

      - name: Build images
        run: docker compose -f deploy/compose.yml build

  deploy-ec2:
    # main Push 또는 수동 실행에서 deploy=true를 선택했을 때 배포합니다.
    if: >-
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: wk01

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure verified SSH identity
        env:
          AWS_SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$AWS_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$AWS_USER@$AWS_HOST" 'mkdir -p ~/mini_agent_01_llm'
          scp -i ~/.ssh/id_deploy -r mini_agent_01_llm/. "$AWS_USER@$AWS_HOST:~/mini_agent_01_llm/"

      - name: Deploy Compose and verify health
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy "$AWS_USER@$AWS_HOST" '
            set -eu
            cd ~/mini_agent_01_llm
            test -f .env
            docker compose --env-file .env -f deploy/compose.yml config --quiet
            docker compose --env-file .env -f deploy/compose.yml up -d --build
            curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/health
            curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8501/_stcore/health
          '
